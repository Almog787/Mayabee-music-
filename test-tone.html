<!DOCTYPE html>
<html>
<body>
  <button id="start">Start All</button>
  <button id="stop1">Stop 1</button>
  <button id="stop2">Stop 2</button>
  <script type="module">
    import * as Tone from 'https://jspm.dev/tone';
    let seq1, seq2, synth1, synth2;
    document.getElementById('start').onclick = async () => {
      await Tone.start();
      synth1 = new Tone.Synth().toDestination();
      synth2 = new Tone.Synth().toDestination();
      seq1 = new Tone.Sequence((time, note) => {
        synth1.triggerAttackRelease(note, "16n", time);
      }, ["C4", null, "E4", null], "8n");
      seq2 = new Tone.Sequence((time, note) => {
        synth2.triggerAttackRelease(note, "16n", time);
      }, [null, "D4", null, "F4"], "8n");
      Tone.Transport.start();
      seq1.start(0);
      seq2.start(0);
    };
    document.getElementById('stop1').onclick = () => seq1.stop();
    document.getElementById('stop2').onclick = () => seq2.stop();
  </script>
</body>
</html>
